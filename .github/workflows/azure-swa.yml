name: Deploy to Azure Static Web Apps

# Builds the handbook and deploys it to Azure Static Web Apps using a
# deployment token stored as the GitHub Actions secret
# AZURE_STATIC_WEB_APPS_API_TOKEN. The token value is never in the repo.
# Runs alongside the GitHub Pages workflow on every push to gh-pages.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and stage site
        run: |
          python3 build.py
          mkdir -p _site
          cp index.html _site/index.html
          cp -r data assets _site/ 2>/dev/null || true

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: "_site"     # pre-built static site
          api_location: ""          # no API yet (added in the chat phase)
          output_location: ""
          skip_app_build: true      # index.html is already built above
