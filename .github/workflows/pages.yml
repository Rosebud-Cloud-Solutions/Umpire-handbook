name: Deploy to GitHub Pages

# Builds the self-contained handbook and publishes it to GitHub Pages.
# Runs on GitHub's servers, and enables Pages automatically (enablement: true)
# so no manual Settings toggle is required. Deploys only from the gh-pages
# branch, so the main branch is never touched.

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html from rules.json + template
        run: python3 build.py

      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r data assets _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Configure Pages (enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
